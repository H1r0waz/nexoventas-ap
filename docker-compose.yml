services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexoventas
      POSTGRES_USER: nexoventas
      POSTGRES_PASSWORD: nexoventas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/nexoventas
      DB_USERNAME: nexoventas
      DB_PASSWORD: nexoventas_dev
      JWT_SECRET: replace-this-with-a-long-random-production-secret
    ports:
      - "8080:8080"
    depends_on:
      - database
volumes:
  postgres-data:
