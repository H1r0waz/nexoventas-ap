  <g font-family="Arial, Helvetica, sans-serif"><text x="120" y="846" fill="#5bbff4" font-size="20" font-weight="700" letter-spacing="2">JAVA 21 · SPRING BOOT · POSTGRESQL · JWT</text></g>
