      <rect x="740" y="382" width="290" height="135" rx="16" fill="#123c52"/>
      <text x="768" y="423" fill="#a9c2dd" font-size="17">STOCK DISPONIBLE</text><text x="768" y="477" fill="#fff" font-size="38" font-weight="700">1.248</text>
      <rect x="1055" y="382" width="390" height="135" rx="16" fill="#202e52"/>
