    <text x="202" y="494" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Resumen</text>
    <text x="202" y="560" fill="#b6cae2" font-family="Arial, Helvetica, sans-serif" font-size="19">Productos</text>
