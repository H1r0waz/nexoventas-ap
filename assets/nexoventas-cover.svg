<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NexoVentas API</title>
  <desc id="desc">Panel de gestión comercial con ventas, inventario y productos</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a50"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27c2ff"/><stop offset="1" stop-color="#4361ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#020812" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1420" cy="-20" r="340" fill="#1764c0" opacity=".18"/><circle cx="80" cy="850" r="330" fill="#19aee8" opacity=".11"/>
  <g font-family="Arial, Helvetica, sans-serif">
